<style>

@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#98978f;--line:#2d2d2b;--accent:#6da7ec;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9085e9;--good:#4cc38a;--warn:#e3a53a;--bad:#ee7a79;--chip:#262624}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 0;max-width:1600px;margin:0 auto}h1{font-size:20px;margin:0 0 2px}.sub{color:var(--ink2);font-size:13px}

td:last-child .b.sm{margin:2px 0}td:last-child{white-space:normal;min-width:230px}

.card h2{font-size:15px;margin:0 0 8px}.card h3{font-size:13px;margin:12px 0 4px;color:var(--ink2)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:12px;color:var(--ink2)}input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;margin-top:2px}

button.b{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button.b.sec{background:var(--chip);color:var(--ink)}button.b.dng{background:var(--bad)}button.b.sm{padding:4px 8px;font-size:12px}

 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}a{color:#000;text-decoration:none}
}

<body>
<header><h1>Simulador de Planejamento Tributário</h1>
<div class="sub">Simples × Presumido × Real × Simples com IBS/CBS regular — transição da Reforma Tributária 2026–2033. Baseado nas regras da Calculadora RTC da Receita Federal (código aberto, MIT).</div><div id="userbar" class="note" style="margin-top:6px"></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script>
/* Motor de cálculo — Simulador de Planejamento Tributário (Simples / Presumido / Real + transição CBS/IBS)
   Lógica de CBS/IBS espelha a Calculadora RTC da Receita Federal: vTrib = vBC × pAliq × (1 − pRedAliq/100),
   arredondamento HALF_EVEN. Premissas e simplificações estão documentadas na aba "Metodologia". */
(function (root) {
  'use strict';

  // ---------- util ----------
  function r2(x) { // HALF_EVEN, 2 casas (mesma política da calculadora oficial)
    var s = x * 100, f = Math.floor(s), d = s - f, eps = 1e-9;
    var v;
    if (Math.abs(d - 0.5) < eps) v = (f % 2 === 0) ? f : f + 1; else v = Math.round(s);
    return v / 100;
  }
  var YEARS = [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033];

  // ---------- Simples Nacional: LC 123/2006, Anexos I–V (faixas: [teto RBT12, alíq. nominal, parcela a deduzir]) ----------
  var ANEXOS = {
    I:   { nome: 'Anexo I — Comércio', faixas: [[180000,.04,0],[360000,.073,5940],[720000,.095,13860],[1800000,.107,22500],[3600000,.143,87300],[4800000,.19,378000]],
           part: { irpj:5.5, csll:3.5, cofins:12.74, pis:2.76, cpp:41.5, icms:34, iss:0, ipi:0 } },
    II:  { nome: 'Anexo II — Indústria', faixas: [[180000,.045,0],[360000,.078,5940],[720000,.10,13860],[1800000,.112,22500],[3600000,.147,85500],[4800000,.30,720000]],
           part: { irpj:5.5, csll:3.5, cofins:11.51, pis:2.49, cpp:37.5, icms:32, iss:0, ipi:7.5 } },
    III: { nome: 'Anexo III — Serviços', faixas: [[180000,.06,0],[360000,.112,9360],[720000,.135,17640],[1800000,.16,35640],[3600000,.21,125640],[4800000,.33,648000]],
           part: { irpj:4, csll:3.5, cofins:12.82, pis:2.78, cpp:43.4, icms:0, iss:33.5, ipi:0 } },
    IV:  { nome: 'Anexo IV — Serviços (CPP fora do DAS)', faixas: [[180000,.045,0],[360000,.09,8100],[720000,.102,12420],[1800000,.14,39780],[3600000,.22,183780],[4800000,.33,828000]],
           part: { irpj:18.8, csll:15.2, cofins:17.67, pis:3.83, cpp:0, icms:0, iss:44.5, ipi:0 } },
    V:   { nome: 'Anexo V — Serviços (Fator R < 28%)', faixas: [[180000,.155,0],[360000,.18,4500],[720000,.195,9900],[1800000,.205,17100],[3600000,.23,62100],[4800000,.305,540000]],
           part: { irpj:25, csll:15, cofins:14.1, pis:3.05, cpp:28.85, icms:0, iss:14, ipi:0 } }
  };
  var LIMITE_SN = 4800000, SUBLIMITE_SN = 3600000;

  function simplesEfetiva(rbt12, anexo) {
    var A = ANEXOS[anexo], f = A.faixas, i;
    if (rbt12 > LIMITE_SN) return null;
    for (i = 0; i < f.length; i++) if (rbt12 <= f[i][0]) break;
    var fx = f[i];
    if (rbt12 <= 0) return { aliq: f[0][1], nominal: f[0][1], faixa: 1 };
    return { aliq: (rbt12 * fx[1] - fx[2]) / rbt12, nominal: fx[1], faixa: i + 1 };
  }

  // ---------- Cenários de alíquotas de referência ----------
  var CENARIOS = {
    tcu: { nome: 'TCU 2027 (CBS 11,3%) + estimativa CGIBS do IBS (18,7%)', cbs: 11.3, ibs: 18.7 },
    lc214: { nome: 'Referência original LC 214/2025 (CBS 8,8% + IBS 17,7%)', cbs: 8.8, ibs: 17.7 },
    custom: { nome: 'Personalizado', cbs: 11.3, ibs: 18.7 }
  };
  // Cronograma LC 214/2025: IBS 0,1% em 2027–28; 2029–32 = 10/20/30/40% do IBS pleno (ICMS/ISS reduzidos na mesma proporção); 2033 = 100%.
  var FRAC_IBS = { 2026: 0, 2027: 0, 2028: 0, 2029: .1, 2030: .2, 2031: .3, 2032: .4, 2033: 1 };

  function taxasAno(y, p) {
    var t = { ano: y, cbs: 0, ibs: 0, fracIcmsIss: 1, pisCofins: true, teste: false };
    if (y <= 2026) { t.teste = true; return t; } // 2026: teste 0,9% CBS + 0,1% IBS, compensado — sem carga líquida adicional
    t.pisCofins = false;
    if (y <= 2028) { t.cbs = p.cbs - (p.redutorCbs ? 0.1 : 0); t.ibs = 0.1; t.fracIcmsIss = 1; }
    else { t.cbs = p.cbs; t.ibs = p.ibs * FRAC_IBS[y]; t.fracIcmsIss = 1 - FRAC_IBS[y]; }
    return t;
  }

  var PARAMS_PADRAO = { cenario: 'tcu', cbs: 11.3, ibs: 18.7, redutorCbs: true, creditoSimples: 30, excluirIcmsPisCofins: true, patronalPadrao: 28.8 };

  // ---------- Empresa ----------
  var TIPOS = {
    comercio:  { nome: 'Comércio', anexo: 'I', ci: true, pres: [8, 12] },
    industria: { nome: 'Indústria', anexo: 'II', ci: true, pres: [8, 12] },
    serv3:     { nome: 'Serviços (Anexo III)', anexo: 'III', ci: false, pres: [32, 32] },
    serv4:     { nome: 'Serviços (Anexo IV)', anexo: 'IV', ci: false, pres: [32, 32] },
    servR:     { nome: 'Serviços (Anexo III/V — Fator R)', anexo: 'R', ci: false, pres: [32, 32] }
  };

  function normaliza(e) {
    function n(v, d) { v = parseFloat(v); return isFinite(v) ? v : d; }
    return {
      id: e.id, razao: e.razao || '', cnpj: e.cnpj || '', im: e.im || '', uf: e.uf || '', municipio: e.municipio || '', ibge: e.ibge || '',
      regimeAtual: e.regimeAtual || 'simples', tipo: TIPOS[e.tipo] ? e.tipo : 'comercio',
      receita: n(e.receita, 0), folha: n(e.folha, 0), compras: n(e.compras, 0), despesas: n(e.despesas, 0),
      pctB2B: n(e.pctB2B, 0), pctFornSimples: n(e.pctFornSimples, 0),
      aliqIcms: n(e.aliqIcms, 18), aliqIss: n(e.aliqIss, 5), reducao: n(e.reducao, 0),
      crescimento: n(e.crescimento, 0), patronal: n(e.patronal, NaN)
    };
  }

  function anexoDe(e, rev, folha) {
    var t = TIPOS[e.tipo];
    if (t.anexo !== 'R') return { anexo: t.anexo, fatorR: null };
    var fr = rev > 0 ? folha / rev : 0;
    return { anexo: fr >= 0.28 ? 'III' : 'V', fatorR: fr };
  }

  // IBS/CBS pelo regime regular (Presumido, Real e Simples que opta pelo regime regular)
  function ibsCbsRegular(e, rev, compras, t, p) {
    var aliq = (t.cbs + t.ibs) / 100;
    var red = 1 - e.reducao / 100;
    var cbsDeb = r2(rev * (t.cbs / 100) * red), ibsDeb = r2(rev * (t.ibs / 100) * red);
    var fs = e.pctFornSimples / 100, f = p.creditoSimples / 100;
    var credFactor = (1 - fs) + fs * f;
    var cbsCred = r2(compras * credFactor * (t.cbs / 100)), ibsCred = r2(compras * credFactor * (t.ibs / 100));
    return { cbs: cbsDeb - cbsCred, ibs: ibsDeb - ibsCred, cbsDeb: cbsDeb, ibsDeb: ibsDeb, cbsCred: cbsCred, ibsCred: ibsCred, aliq: aliq };
  }

  function irpjCsll(baseIr, baseCs) {
    var ir = Math.max(0, baseIr), cs = Math.max(0, baseCs);
    return { irpj: r2(ir * .15 + Math.max(0, ir - 240000) * .10), csll: r2(cs * .09) };
  }

  function simulaAno(e0, y, p) {
    var e = normaliza(e0), t = taxasAno(y, p), g = Math.pow(1 + e.crescimento / 100, y - 2026);
    var rev = e.receita * g, folha = e.folha * g, compras = e.compras * g, desp = e.despesas * g;
    var tp = TIPOS[e.tipo], ci = tp.ci;
    var patr = isFinite(e.patronal) ? e.patronal : p.patronalPadrao;
    var cppFora = r2(folha * patr / 100);
    var out = { ano: y, receita: rev, folha: folha, taxas: t, regimes: {} };

    // ---- Simples Nacional (padrão) ----
    var an = anexoDe(e, rev, folha), ef = simplesEfetiva(rev, an.anexo);
    out.anexo = an.anexo; out.fatorR = an.fatorR;
    if (ef) {
      var das = r2(rev * ef.aliq), cppSN = (an.anexo === 'IV') ? cppFora : 0;
      var part = ANEXOS[an.anexo].part;
      var shPC = (part.pis + part.cofins) / 100, shIcmsIss = (part.icms + part.iss) / 100, shIpi = part.ipi / 100;
      // parcela do DAS que equivale a IBS/CBS a partir de 2027 (crédito ao cliente B2B)
      var shIbsCbs = 0;
      if (y >= 2027) shIbsCbs = shPC + shIpi + shIcmsIss * (1 - t.fracIcmsIss);
      var credSN = r2(rev * (e.pctB2B / 100) * ef.aliq * shIbsCbs);
      out.regimes.simples = { total: das + cppSN, das: das, cpp: cppSN, aliqEfetiva: ef.aliq, faixa: ef.faixa, creditoCliente: credSN, elegivel: true };

      // ---- Simples + regime regular de IBS/CBS (a partir de 2027) ----
      if (y >= 2027) {
        var excl = shPC + shIpi + shIcmsIss * (1 - t.fracIcmsIss);
        var dasH = r2(das * (1 - excl)), reg = ibsCbsRegular(e, rev, compras, t, p);
        out.regimes.hibrido = { total: dasH + cppSN + reg.cbs + reg.ibs, das: dasH, cpp: cppSN, cbs: reg.cbs, ibs: reg.ibs, elegivel: true };
      }
    } else {
      out.regimes.simples = { total: null, elegivel: false, motivo: 'Receita acima de R$ 4,8 milhões' };
      if (y >= 2027) out.regimes.hibrido = { total: null, elegivel: false };
    }

    // ---- tributos indiretos "antigos" (ICMS/ISS e PIS/Cofins) ----
    var icmsLiq = 0, issLiq = 0;
    if (ci) icmsLiq = (rev - compras) * (e.aliqIcms / 100) * t.fracIcmsIss;
    else issLiq = rev * (e.aliqIss / 100) * t.fracIcmsIss;
    icmsLiq = r2(icmsLiq); issLiq = r2(issLiq);
    var icmsDeb = ci ? rev * e.aliqIcms / 100 : 0;
    var reg2 = (y >= 2026 && !t.pisCofins) ? ibsCbsRegular(e, rev, compras, t, p) : { cbs: 0, ibs: 0 };

    // ---- Lucro Presumido ----
    var pcPres = 0;
    if (t.pisCofins) { var baseP = rev - (p.excluirIcmsPisCofins ? icmsDeb : 0); pcPres = r2(baseP * 0.0365); }
    var presIr = irpjCsll(rev * tp.pres[0] / 100, rev * tp.pres[1] / 100);
    var tPres = presIr.irpj + presIr.csll + pcPres + icmsLiq + issLiq + reg2.cbs + reg2.ibs + cppFora;
    out.regimes.presumido = { total: tPres, irpj: presIr.irpj, csll: presIr.csll, pisCofins: pcPres, cbs: reg2.cbs, ibs: reg2.ibs, icms: icmsLiq, iss: issLiq, cpp: cppFora, elegivel: true };

    // ---- Lucro Real ----
    var pcReal = 0;
    if (t.pisCofins) {
      var baseD = rev - (p.excluirIcmsPisCofins ? icmsDeb : 0);
      var baseC = compras * (ci ? (1 - e.aliqIcms / 100) : 1);
      pcReal = r2(baseD * 0.0925 - baseC * 0.0925);
    }
    var indiretos = icmsLiq + issLiq + pcReal + reg2.cbs + reg2.ibs;
    var lucro = rev - indiretos - compras - desp - folha - cppFora;
    var realIr = irpjCsll(lucro, lucro);
    var tReal = realIr.irpj + realIr.csll + indiretos + cppFora;
    out.regimes.real = { total: tReal, irpj: realIr.irpj, csll: realIr.csll, pisCofins: pcReal, cbs: reg2.cbs, ibs: reg2.ibs, icms: icmsLiq, iss: issLiq, cpp: cppFora, lucro: lucro, elegivel: true };

    // ---- melhor opção ----
    var best = null;
    Object.keys(out.regimes).forEach(function (k) {
      var r = out.regimes[k]; if (r.elegivel && r.total != null && (best === null || r.total < out.regimes[best].total)) best = k;
    });
    out.melhor = best;

    // ---- crédito perdido pelo cliente B2B (Simples padrão × regime regular) ----
    if (y >= 2027) {
      var regCred = r2(rev * (e.pctB2B / 100) * (t.cbs + t.ibs) / 100 * (1 - e.reducao / 100));
      var sc = out.regimes.simples.elegivel ? out.regimes.simples.creditoCliente : 0;
      out.creditoClienteRegular = regCred; out.creditoClienteSimples = sc; out.creditoPerdido = Math.max(0, regCred - sc);
    }
    return out;
  }

  function simulaEmpresa(e, p) {
    p = Object.assign({}, PARAMS_PADRAO, p || {});
    var anos = YEARS.map(function (y) { return simulaAno(e, y, p); });
    return { empresa: normaliza(e), anos: anos, params: p, otimFatorR: otimizaFatorR(e, p) };
  }

  // Otimização do Fator R (ano-base 2026): eleva a folha até 28% da receita para migrar do Anexo V ao III
  function otimizaFatorR(e0, p) {
    var e = normaliza(e0);
    if (TIPOS[e.tipo].anexo !== 'R' || e.receita <= 0 || e.receita > LIMITE_SN) return null;
    var fr = e.folha / e.receita; if (fr >= 0.28) return { aplica: false, fatorR: fr };
    var efV = simplesEfetiva(e.receita, 'V'), efIII = simplesEfetiva(e.receita, 'III');
    var necessaria = e.receita * 0.28, extra = necessaria - e.folha;
    var dasV = r2(e.receita * efV.aliq), dasIII = r2(e.receita * efIII.aliq);
    // Anexo III já inclui a CPP no DAS; o custo adicional é a própria remuneração (sem patronal fora do DAS).
    // Atenção: no Anexo V a CPP também está no DAS, portanto não há patronal extra em nenhum dos dois.
    var economia = dasV - dasIII - extra;
    return { aplica: true, fatorR: fr, folhaNecessaria: necessaria, folhaExtra: extra, dasV: dasV, dasIII: dasIII, economiaLiquida: economia };
  }

  // Modelo de payload para a Calculadora RTC oficial (POST /api/calculadora/regime-geral) — conferência pontual
  function payloadCalculadoraOficial(e0, y, p) {
    var e = normaliza(e0); p = Object.assign({}, PARAMS_PADRAO, p || {});
    var t = taxasAno(Math.max(y, 2027), p), g = Math.pow(1 + e.crescimento / 100, y - 2026);
    var baseMensal = Math.round(e.receita * g / 12 * 100) / 100;
    return {
      id: 'SIMULACAO-' + (e.cnpj || e.id || 'EMPRESA').toString().replace(/\D/g, ''),
      versao: '1.0.0', dhFatoGerador: Math.max(y, 2027) + '-03-10T10:00:00-03:00',
      municipio: parseInt(e.ibge, 10) || 0, uf: e.uf || 'RJ',
      itens: [{
        numero: 1, '_AJUSTAR_nbs_ou_ncm': 'informe NBS (serviço) ou NCM (mercadoria)', cst: '000', cClassTrib: '000001',
        baseCalculo: baseMensal,
        aliquotasNominais: { cbs: t.cbs, ibsEstadual: +(t.ibs / 2).toFixed(4), ibsMunicipal: +(t.ibs / 2).toFixed(4) }
      }]
    };
  }

  var api = { r2: r2, YEARS: YEARS, ANEXOS: ANEXOS, LIMITE_SN: LIMITE_SN, SUBLIMITE_SN: SUBLIMITE_SN, CENARIOS: CENARIOS, FRAC_IBS: FRAC_IBS,

  var kp='<div class="grid g4"><div class="kpi"><div class="l">Regime atual</div><div class="n" style="font-size:16px">'+REG[n.regimeAtual].n+'</div><div class="d">carga 2026: '+R(ta)+' ('+P(ta/s.anos[0].receita)+' da receita)</div></div>'+
   '<div class="kpi"><div class="l">Melhor regime em 2026</div><div class="n" style="font-size:16px">'+REG[a0.melhor].n+'</div><div class="d">carga: '+R(tb)+' ('+P(tb/a0.receita)+')</div></div>'+
   '<div class="kpi"><div class="l">Economia anual possível</div><div class="n '+(eco>0.5?'good':'')+'">'+(eco>0.5?R(eco):'—')+'</div><div class="d">'+(eco>0.5?'vs regime atual, 2026':'regime atual já é o menor')+'</div></div>'+
   '<div class="kpi"><div class="l">Melhor em 2033 (reforma plena)</div><div class="n" style="font-size:16px">'+REG[s.anos[7].melhor].n+'</div><div class="d">'+R(totalRegime(s.anos[7],s.anos[7].melhor))+'</div></div></div>';
  var keys=ORDER.filter(function(k){return k!=='hibrido'||s.anos.some(function(a){return a.regimes.hibrido&&a.regimes.hibrido.elegivel})});
  var series=keys.map(function(k){return{name:REG[k].n.replace('Simples + IBS/CBS regular','Simples híbrido'),color:REG[k].c,dash:REG[k].d,values:s.anos.map(function(a){return totalRegime(a,k)})}});
  var chart='<div class="card"><h2>Carga tributária anual por regime, 2026–2033</h2>'+lineChart('ch-emp',series,M.YEARS)+legend(keys)+'</div>';
  var th='<tr><th>Ano</th><th>Receita</th>'+keys.map(function(k){return '<th>'+REG[k].n+'</th>'}).join('')+'<th>Melhor</th></tr>',tb2='';
  s.anos.forEach(function(a){tb2+='<tr><td>'+a.ano+'</td><td>'+R(a.receita)+'</td>'+keys.map(function(k){var t=totalRegime(a,k);return '<td class="'+(t==null?'na':(a.melhor===k?'v good':''))+'">'+(t==null?(a.regimes[k]&&!a.regimes[k].elegivel?'inelegível':'—'):R(t))+'</td>'}).join('')+'<td>'+REG[a.melhor].n+'</td></tr>'});
  var tab='<div class="card"><h2>Detalhamento anual</h2><div class="tw"><table>'+th+tb2+'</table></div><p class="note">Em verde: menor carga do ano. 2026: CBS/IBS em teste (0,9%/0,1%) sem carga líquida adicional.</p></div>';
  var det=detalhe(s);
  var plan='<div class="card"><h2>Plano tributário sugerido</h2><ul class="plan">'+planoItens(s).map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><div class="row" style="margin-top:10px"><button class="b" data-act="print">Imprimir / salvar PDF</button><button class="b sec" data-act="copyplan">Copiar relatório (texto)</button><button class="b sec" data-act="payload">Gerar modelo para Calculadora RTC oficial</button></div><div id="out"></div></div>';
  return sel+'<div class="card"><h2>'+esc(n.razao)+'</h2>'+kp+'</div>'+chart+plan+det+tab}

function detalhe(s){
  var a=s.anos[0],b=s.anos[1],c=s.anos[7],pr=a.regimes.presumido,rl=a.regimes.real;
  function cmp(x){return '<tr><td>'+x[0]+'</td><td>'+R(x[1])+'</td><td>'+R(x[2])+'</td><td>'+R(x[3])+'</td></tr>'}
  var p27=b.regimes.presumido,p33=c.regimes.presumido,r27=b.regimes.real,r33=c.regimes.real;
  return '<div class="card"><h2>Composição da carga — Presumido e Real</h2><div class="tw"><table><tr><th>Componente</th><th>2026</th><th>2027</th><th>2033</th></tr>'+
  '<tr><th colspan="4">Lucro Presumido</th></tr>'+[['IRPJ',pr.irpj,p27.irpj,p33.irpj],['CSLL',pr.csll,p27.csll,p33.csll],['PIS/Cofins',pr.pisCofins,p27.pisCofins,p33.pisCofins],['CBS',pr.cbs,p27.cbs,p33.cbs],['IBS',pr.ibs,p27.ibs,p33.ibs],['ICMS líquido',pr.icms,p27.icms,p33.icms],['ISS',pr.iss,p27.iss,p33.iss],['CPP patronal',pr.cpp,p27.cpp,p33.cpp]].map(cmp).join('')+
  '<tr><th colspan="4">Lucro Real</th></tr>'+[['IRPJ',rl.irpj,r27.irpj,r33.irpj],['CSLL',rl.csll,r27.csll,r33.csll],['PIS/Cofins líquido',rl.pisCofins,r27.pisCofins,r33.pisCofins],['CBS líquida',rl.cbs,r27.cbs,r33.cbs],['IBS líquido',rl.ibs,r27.ibs,r33.ibs],['ICMS líquido',rl.icms,r27.icms,r33.icms],['ISS',rl.iss,r27.iss,r33.iss],['CPP patronal',rl.cpp,r27.cpp,r33.cpp],['Lucro tributável',rl.lucro,r27.lucro,r33.lucro]].map(cmp).join('')+'</table></div></div>'}

function planoItens(s){
  var n=s.empresa,L=[],a=s.anos[0],ka=atualKey(n,a),ta=totalRegime(a,ka),tb=totalRegime(a,a.melhor),eco=ta-tb;
  if(!a.regimes.simples.elegivel&&n.regimeAtual==='simples')L.push('<b class="bad">Atenção:</b> a receita informada excede o limite do Simples (R$ 4,8 mi). Avalie o enquadramento imediatamente.');
  if(a.melhor===ka)L.push('<b>Regime 2026:</b> manter <b>'+REG[ka].n+'</b> — é o de menor carga ('+R(ta)+', '+P(ta/a.receita)+' da receita).');
  else L.push('<b>Regime 2026:</b> migrar de '+REG[ka].n+' para <b>'+REG[a.melhor].n+'</b> reduz a carga em <b class="good">'+R(eco)+'/ano</b> ('+P(eco/ta)+'). Observe os prazos de opção (Simples: janeiro; Presumido/Real: 1º pagamento do ano).');
  var y27=s.anos[1];
  if(y27.regimes.hibrido&&y27.regimes.hibrido.elegivel){var h=y27.regimes.hibrido.total,sn=y27.regimes.simples.total;
    if(h<sn-0.5)L.push('<b>2027:</b> optar pelo regime regular de IBS/CBS dentro do Simples economiza '+R(sn-h)+' no ano (créditos das aquisições superam o custo) e entrega crédito integral ao cliente B2B.');
    else L.push('<b>2027:</b> permanecer no Simples padrão é mais barato que o regime regular de IBS/CBS ('+R(sn)+' × '+R(h)+').');}
  if(y27.creditoPerdido>0.5&&n.pctB2B>0)L.push('<b>Competitividade B2B:</b> clientes PJ do regime regular perdem cerca de <b>'+R(y27.creditoPerdido)+'</b> em crédito de IBS/CBS ao comprar de você no Simples padrão em 2027 ('+R(s.anos[7].creditoPerdido)+' em 2033). Esse valor tende a virar pedido de desconto ou perda de cliente — ele é o benchmark para decidir pelo regime regular.');
  var g=s.anos[0],last=s.anos[7],kl=last.melhor;
  L.push('<b>Reforma plena (2033):</b> regime de menor carga será <b>'+REG[kl].n+'</b> ('+R(totalRegime(last,kl))+'). Entre 2029 e 2032 o ICMS/ISS cai 10 pontos por ano enquanto o IBS sobe; revise o regime anualmente.');
  var ex=s.anos.filter(function(y){return !y.regimes.simples.elegivel})[0];
  if(n.regimeAtual==='simples'&&ex)L.push('<b>Limite do Simples:</b> com crescimento de '+n.crescimento.toLocaleString('pt-BR')+'% a.a., a receita ultrapassa R$ 4,8 mi em <b>'+ex.ano+'</b> — planeje a transição para Presumido/Real.');
  var sub=s.anos.filter(function(y){return y.receita>M.SUBLIMITE_SN&&y.regimes.simples.elegivel})[0];
  if(sub&&n.regimeAtual==='simples')L.push('<b>Sublimite:</b> acima de R$ 3,6 mi, ICMS/ISS passam a ser recolhidos fora do DAS (a simulação não modela esse efeito; confira).');
  var of=s.otimFatorR;
  if(of&&of.aplica){if(of.economiaLiquida>0)L.push('<b>Fator R:</b> hoje '+P(of.fatorR)+' (&lt; 28%) → Anexo V. Elevar folha/pró-labore em '+R(of.folhaExtra)+'/ano (total '+R(of.folhaNecessaria)+') migra para o Anexo III e economiza líquido <b class="good">'+R(of.economiaLiquida)+'/ano</b> (DAS '+R(of.dasV)+' → '+R(of.dasIII)+'), já descontado o custo da remuneração adicional.');
    else L.push('<b>Fator R:</b> hoje '+P(of.fatorR)+'; elevar a folha até 28% <u>não compensa</u> (economia líquida '+R(of.economiaLiquida)+').');}
  else if(of&&!of.aplica)L.push('<b>Fator R:</b> '+P(of.fatorR)+' ≥ 28% — já enquadrado no Anexo III. Mantenha a folha/pró-labore acima de 28% da receita.');
  var re=s.anos[1].regimes.real;if(re.cbs<0)L.push('<b>Saldo credor de CBS:</b> as aquisições geram mais crédito que débito (o simulador considera o saldo como redução da carga; na prática há regras de ressarcimento/compensação).');
  if(n.reducao>0)L.push('<b>Redução de alíquota '+n.reducao+'%:</b> aplicada à alíquota de IBS/CBS nas vendas (alíquota efetiva = alíquota × (1 − redução), como na Calculadora RTC). Confirme o cClassTrib da atividade.');
  if(n.pctFornSimples>30)L.push('<b>Cadeia de fornecedores:</b> '+n.pctFornSimples+'% das aquisições vêm do Simples — crédito reduzido (premissa: '+S.params.creditoSimples+'% do crédito cheio). Renegociar com fornecedores do regime regular pode elevar o crédito.');
  return L}

function planoTexto(s){var d=document.createElement('div');d.innerHTML=planoItens(s).map(function(i){return '• '+i}).join('\n');return s.empresa.razao+' — Plano tributário (simulação)\n\n'+d.textContent+'\n\nEstimativa para planejamento; não substitui apuração oficial.'}

function viewMetodo(){return '<div class="card"><h2>Base normativa e fontes</h2><ul class="plan">'+
 '<li><a href="https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/novembro/receita-federal-publica-primeiro-codigo-fonte-aberto-no-github-e-amplia-transparencia-da-reforma-tributaria" target="_blank" rel="noopener">Receita Federal — código-fonte aberto da Calculadora de Tributos (nov/2026)</a>, Portaria Cotec nº 342/2026, licença MIT.</li>'+
 '<li>Repositórios: <code>ReceitaFederal/calculadora-rtc-regime-regular</code> (CBS, IBS e IS — LC 214/2025) e <code>ReceitaFederal/calculadora-rtc-simples-nacional</code>.</li>'+
 '<li>LC 123/2006 (Anexos I–V do Simples e Fator R); LC 214/2025 (CBS/IBS, cronograma de transição, art. 349 — alíquotas de referência); TCU, 28/10/2026 (CBS 2027 = 11,3%).</li></ul>'+
 '<h3>O que foi reaproveitado da Calculadora oficial</h3><ul class="plan"><li>Fórmula do tributo: <code>valor = base × alíquota × (1 − redução)</code> — exemplo da documentação (R$ 1.200, CBS 8,8%, redução 60% → R$ 42,24) reproduzido em teste.</li><li>Arredondamento HALF_EVEN em 2 casas.</li><li>2026 = fase de teste (0,9% CBS + 0,1% IBS); a partir de 2027 as alíquotas são informadas (aqui, pelos cenários).</li><li>A calculadora oficial calcula por documento fiscal; este simulador agrega a carga anual por regime. Use o botão “Gerar modelo para Calculadora RTC” para conferir uma operação.</li></ul>'+
 '<h3>Simplificações — leia antes de decidir</h3><ul class="plan"><li>Cálculo anual (sem apuração trimestral/mensal, adicional de IR sobre 240 mil/ano). Verifique também mudanças recentes nos percentuais de presunção.</li><li>Simples: alíquota efetiva pela fórmula da LC 123 para a RBT12 informada (crescendo conforme a taxa de crescimento). Partição do DAS usa os percentuais da 1ª faixa de cada anexo como aproximação para as demais faixas. Sublimite de R$ 3,6 mi não modelado.</li><li>Simples sem mudança de carga na transição; a parcela de PIS/Cofins/IPI/ICMS/ISS do DAS passa a representar CBS/IBS (define o crédito ao cliente). No regime regular “híbrido” a parcela correspondente sai do DAS e o IBS/CBS é apurado por débito − crédito.</li><li>Créditos de IBS/CBS: sobre aquisições informadas, com fator reduzido para fornecedores do Simples (premissa editável). Saldo credor reduz a carga.</li><li>ICMS: débito − crédito sobre as compras; ISS sem crédito; reduções do ICMS/ISS conforme cronograma 2029–2033.</li><li>Imposto Seletivo, regimes específicos, Zona Franca, benefícios fiscais e tributação de dividendos não modelados.</li><li>Alíquotas de referência de 2027 em diante são premissas editáveis, ainda não definitivas.</li></ul>'+
 '<h3>Segurança do login</h3><ul class="plan"><li>O cadastro de usuários e o login funcionam <b>somente neste navegador</b>: as senhas são guardadas com hash (PBKDF2-SHA256, 210 mil iterações, salt individual), nunca em texto puro. Não há servidor; quem tiver acesso ao computador/navegador ou ao arquivo pode contornar a tela de login. Para proteção real entre pessoas diferentes, use a versão com servidor.</li><li>Sem recuperação de senha: se o master esquecer a senha, a única saída é limpar os dados do site no navegador (o que apaga usuários e empresas). Faça backup pelo botão Exportar.</li></ul>'+
 '<p class="note">Ferramenta de apoio ao planejamento; não substitui a análise do contador responsável nem a apuração oficial.</p></div>'}

function numFix(e){['receita','folha','compras','despesas','pctB2B','pctFornSimples','aliqIcms','aliqIss','reducao','crescimento','patronal'].forEach(function(k){var v=parseBR(e[k]);e[k]=isFinite(v)?v:(k==='patronal'?S.params.patronalPadrao:0)});delete e.__novo;return e}
function parseBR(v){if(typeof v==='number')return v;v=String(v==null?'':v).trim().replace(/[R$\s%]/g,'');if(v==='')return NaN;if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)}

var ALIAS={razao:['razao','razao social','razão social','nome','empresa'],cnpj:['cnpj'],im:['im','inscricao municipal','inscrição municipal'],uf:['uf','estado'],municipio:['municipio','município','cidade'],ibge:['ibge','codigo ibge','código ibge'],regimeAtual:['regime','regimeatual','regime atual','regime tributario','regime tributário'],tipo:['atividade','tipo','tipo atividade'],receita:['receita','receita anual','rbt12','faturamento'],folha:['folha','folha anual'],compras:['compras','aquisicoes','aquisições'],despesas:['despesas'],pctB2B:['pctb2b','b2b','% b2b'],pctFornSimples:['pctfornsimples','fornecedores simples'],aliqIcms:['aliqicms','icms'],aliqIss:['aliqiss','iss'],reducao:['reducao','redução'],crescimento:['crescimento'],patronal:['patronal','encargos']};
function normKey(h){h=h.trim().toLowerCase();for(var k in ALIAS)if(ALIAS[k].indexOf(h)>=0)return k;return null}
function mapRegime(v){v=String(v||'').toLowerCase();return v.indexOf('simples')>=0?'simples':v.indexOf('presum')>=0?'presumido':v.indexOf('real')>=0?'real':'simples'}
function mapTipo(v){v=String(v||'').toLowerCase();if(M.TIPOS[v])return v;if(v.indexOf('ind')>=0)return 'industria';if(v.indexOf('com')>=0)return 'comercio';if(v.indexOf('iv')>=0)return 'serv4';if(v.indexOf('fator')>=0||v.indexOf(' v')>=0)return 'servR';if(v.indexOf('serv')>=0)return 'serv3';return 'comercio'}
function importText(t){t=t.trim();var out=[];
  try{var j=JSON.parse(t);if(Array.isArray(j)){j.forEach(function(o){o.id=uid();out.push(o)});return out}}catch(e){}
  var lines=t.split(/\r?\n/).filter(function(l){return l.trim()});if(lines.length<2)return out;
  var del=(lines[0].split(';').length>lines[0].split(',').length)?';':',';var heads=lines[0].split(del).map(normKey);
  lines.slice(1).forEach(function(l){var c=l.split(del),o={id:uid()};heads.forEach(function(k,i){if(k)o[k]=(c[i]||'').trim()});o.regimeAtual=mapRegime(o.regimeAtual);o.tipo=mapTipo(o.tipo);out.push(numFix(o))});return out}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');if(a==='selemp')return;ev.preventDefault();

  if(a==='print'){window.print();return}else if(a==='tab'){S.tab=t.getAttribute('data-v');S.edit=null;S.modal=null;S.share=null;S.resetFor=null}
  else if(a==='logout'){try{sessionStorage.removeItem(SID)}catch(e){}S.user=null;S.edit=null;S.modal=null;S.share=null;S.resetFor=null}
  else if(a==='share'){S.share=id;S.edit=null;S.modal=null}
  else if(a==='shareclose'){S.share=null}

  else if(a==='resetuser'){S.resetFor=id}
  else if(a==='cancelreset'){S.resetFor=null}
  else if(a==='toggleuser'){var tu=S.users.filter(function(x){return x.id===id})[0];if(tu&&tu.role!=='master'){tu.ativo=!tu.ativo;save()}}
  else if(a==='deluser'){if(S.confirmDel===id){S.users=S.users.filter(function(x){return x.id!==id});S.empresas.forEach(function(e){e.compart=(e.compart||[]).filter(function(x){return x!==id})});S.confirmDel=null;save()}else{S.confirmDel=id;t.textContent='Confirmar exclusão?';return}}
  else if(a==='new'){S.share=null;S.edit={__novo:1,id:uid(),compart:[],razao:'',cnpj:'',im:'',uf:'RJ',municipio:'',ibge:'',regimeAtual:'simples',tipo:'comercio',receita:0,folha:0,compras:0,despesas:0,pctB2B:0,pctFornSimples:0,aliqIcms:18,aliqIss:5,reducao:0,crescimento:0,patronal:S.params.patronalPadrao}}
  else if(a==='edit'){S.share=null;S.edit=Object.assign({},empById(id))}
  else if(a==='cancel'){S.edit=null}
  else if(a==='save'){var e=numFix(readForm());var i=S.empresas.findIndex(function(x){return x.id===e.id});if(i>=0)S.empresas[i]=e;else S.empresas.push(e);S.edit=null;save()}
  else if(a==='del'){if(S.confirmDel===id){S.empresas=S.empresas.filter(function(x){return x.id!==id});S.confirmDel=null;save()}else{S.confirmDel=id;t.textContent='Confirmar?';return}}
  else if(a==='open'){S.sel=id;S.tab='simulacao';save()}
  else if(a==='loaddemo'){S.empresas=demo().map(function(e){e.compart=[];return e});save()}
  else if(a==='imp'||a==='exp'){S.modal=a}
  else if(a==='closemodal'){S.modal=null}
  else if(a==='doimp'){var r=importText(document.getElementById('ta').value);if(r.length){r.forEach(function(o){o.compart=[]});S.empresas=S.empresas.concat(r);S.modal=null;save()}else{t.textContent='Nada reconhecido — verifique o formato';return}}
  else if(a==='copyexp'){var ta=document.getElementById('ta');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){}t.textContent='Copiado (ou selecione e copie)';return}
  else if(a==='copyplan'||a==='payload'){var e2=empById(S.sel),s=sim(e2),txt=a==='payload'?JSON.stringify(M.payloadCalculadoraOficial(e2,2027,S.params),null,2):planoTexto(s);var o=document.getElementById('out');
    o.innerHTML=(a==='payload'?'<p class="note">Modelo de operação (valor mensal médio, 2027) para <code>POST http://localhost:8080/api/calculadora/regime-geral</code> da Calculadora RTC rodando localmente. Ajuste NBS/NCM e cClassTrib da atividade antes de enviar.</p>':'')+'<textarea readonly id="outta">'+esc(txt)+'</textarea>';try{navigator.clipboard.writeText(txt)}catch(e){}document.getElementById('outta').select();return}
  render();if(a==='edit'||a==='new'){var f=document.getElementById('form');if(f)f.scrollIntoView()}
});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.hasAttribute('data-sh')){if(!isM())return;var es=S.empresas.filter(function(x){return x.id===S.share})[0];if(es){var c=es.compart||[],uid2=t.getAttribute('data-sh'),i=c.indexOf(uid2);if(t.checked&&i<0)c.push(uid2);if(!t.checked&&i>=0)c.splice(i,1);es.compart=c;save();render()}return}
  if(t.getAttribute('data-p')&&!isM())return;

  var p=t.getAttribute('data-p');if(p){var v=t.value;if(p==='redutorCbs'||p==='excluirIcmsPisCofins')v=v==='1';else if(p==='cenario'){var c=M.CENARIOS[v];S.params.cenario=v;if(v!=='custom'){S.params.cbs=c.cbs;S.params.ibs=c.ibs}render();save();return}else{v=parseFloat(v);if(!isFinite(v))return;if(p==='cbs'||p==='ibs')S.params.cenario='custom'}S.params[p]=v;save();render()}
});
document.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target,id=f.id,v=function(n){return f.elements[n]?f.elements[n].value:''};
  function fail(m){S.authErr=m;render()}
  if(!(window.crypto&&crypto.subtle)){return fail('Este navegador não oferece criptografia (WebCrypto). Abra por HTTPS ou localhost.')}
  if(id==='f-setup'){if(S.users.length)return;var nome=v('nome').trim(),login=v('login').trim().toLowerCase(),pw=v('pw'),e1=pwErr(pw,v('pw2'));if(!nome||!login)return fail('Informe nome e login.');if(e1)return fail(e1);
    mkUser(nome,login,pw,'master').then(function(u){S.users=[u];if(!S.legacy&&!S.empresas.length)S.empresas=demo();S.empresas.forEach(function(e){e.compart=e.compart||[]});S.sel=S.empresas.length?S.empresas[0].id:null;S.legacy=false;startSession(u);save();render()})}
  else if(id==='f-login'){var lk=lockLeft();if(lk)return fail('Muitas tentativas. Aguarde '+lk+' s.');var lg=v('login').trim().toLowerCase(),u=S.users.filter(function(x){return x.login===lg})[0];
    var probe=u?checkPw(u,v('pw')):pbkdf(v('pw'),newSalt(),ITER).then(function(){return false});
    probe.then(function(ok){if(ok&&u.ativo){okLogin();startSession(u);render()}else if(ok){fail('Usuário desativado. Fale com o master.')}else{failLogin();fail('Login ou senha inválidos.')}})}
  else if(id==='f-newuser'&&isM()){var nome2=v('nome').trim(),login2=v('login').trim().toLowerCase(),pw3=v('pw'),e2=pwErr(pw3);if(!nome2||!login2)return fail('Informe nome e login.');if(e2)return fail(e2);if(S.users.some(function(x){return x.login===login2}))return fail('Já existe um usuário com esse login.');
    mkUser(nome2,login2,pw3,'user').then(function(u){S.users.push(u);save();S.msg='Usuário “'+u.nome+'” cadastrado. Compartilhe empresas na aba Empresas.';S.authErr='';render()})}
  else if(id==='f-reset'&&isM()){var tu=S.users.filter(function(x){return x.id===S.resetFor})[0],e3=pwErr(v('pw'));if(!tu)return;if(e3)return fail(e3);setPw(tu,v('pw')).then(function(){save();S.resetFor=null;S.msg='Senha de '+tu.nome+' redefinida.';render()})}
  else if(id==='f-pw'&&S.user){var e4=pwErr(v('pw'),v('pw2'));if(e4)return fail(e4);checkPw(S.user,v('cur')).then(function(ok){if(!ok)return fail('Senha atual incorreta.');return setPw(S.user,v('pw')).then(function(){save();S.msg='Senha alterada.';S.authErr='';render()})})}
});
load();restoreSession();if(S.user&&!S.empresas.length&&isM()&&!S.empresas.length){}
if(S.user&&S.sel==null&&vis().length)S.sel=vis()[0].id;
render();
